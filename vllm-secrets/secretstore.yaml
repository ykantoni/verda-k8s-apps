# Points External Secrets Operator at OpenBao's in-cluster Service (in
# the sibling verda-k8s-infra repo/cluster). auth.kubernetes.role "vllm"
# and serviceAccountRef "vllm" match what verda-k8s-infra's
# scripts/configure-vllm-secret.sh writes into OpenBao's kubernetes auth
# config (bound_service_account_names=vllm bound_service_account_namespaces=vllm).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: vllm
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: vllm
          serviceAccountRef:
            name: vllm
