# Pulls the Hugging Face token verda-k8s-infra's
# scripts/configure-vllm-secret.sh writes to secret/vllm/hf-token in
# OpenBao, materializing it as a real Secret (vllm-hf-token) that this
# repo's argocd-apps/vllm.yaml's modelSpec.hf_token references. Stays
# unresolved (SecretSynced: False) until that script's token-write step
# actually runs with a real token — never a problem for this file
# itself, since no secret value lives here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vllm-hf-token
  namespace: vllm
spec:
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: vllm-hf-token
  data:
    - secretKey: token
      remoteRef:
        key: vllm/hf-token
        property: token
