apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://vllm-project.github.io/production-stack
    chart: vllm-stack
    targetRevision: 0.1.13
    helm:
      values: |
        servingEngineSpec:
          modelSpec:
            - name: gemma-4-e4b
              enabled: true
              # Not the chart default (lmcache/vllm-openai) — switched to
              # the plain upstream image while debugging a timm/vision-
              # tower dependency issue on the previous model (Gemma 3n);
              # kept here since it's a confirmed-recent, confirmed-working
              # vLLM build (0.29.0) for a model released only months ago
              # (2026-04), where the LMCache fork's bundled vLLM version
              # is unverified. lmcacheConfig.enabled is false below anyway,
              # so nothing LMCache-specific was ever actually in use.
              # Pinned to "latest" rather than a specific tag: vLLM's own
              # docs (recipes.vllm.ai) already show a dedicated
              # --reasoning-parser/--tool-call-parser gemma4, confirming
              # native support exists, but the exact release that added
              # it isn't nailed down here — if this ever needs
              # reproducibility, pin a tag confirmed (via `vllm serve
              # google/gemma-4-E4B-it`) to support it.
              repository: "vllm/vllm-openai"
              tag: "latest"
              modelURL: "google/gemma-4-E4B-it"
              requestCPU: 6
              requestMemory: "16Gi"
              requestGPU: 1
              # Chart default (nvidia.com/mig-4g.71gb) targets MIG-sliced
              # GPUs. gpu1 is a whole, unpartitioned A100 — must be the
              # plain GPU resource name instead.
              requestGPUType: "nvidia.com/gpu"
              limitCPU: 8
              limitMemory: "32Gi"
              # Per your spec. ~16GB for the checkpoint alone (one
              # safetensors file) leaves only a few GB of headroom once
              # tokenizer/config files and vLLM's own scratch space are
              # counted.
              pvcStorage: "20Gi"
              vllmConfig:
                enablePrefixCaching: true
                maxModelLen: 16384
                dtype: "bfloat16"
                # Chart default is 2 — wrong here, there's only 1 GPU.
                tensorParallelSize: 1
                gpuMemoryUtilization: 0.95
                # runner/convert deliberately omitted: the chart's own
                # defaults for these are for an embedding/pooling example,
                # not a chat model. Leaving them unset lets vLLM use its
                # own default (auto-detect a causal LM from the model
                # config), which is what a chat-serving Gemma deployment
                # needs.
              # KV-cache offloading via LMCache — off for this first
              # deployment, to keep the model's own stability/behavior as
              # close to plain vLLM as possible.
              lmcacheConfig:
                enabled: false
              hf_token:
                secretName: "vllm-hf-token"
                secretKey: "token"
              # KEDA isn't installed in this cluster — its ScaledObject CRD
              # doesn't exist, so this must stay off (chart defaults it on).
              keda:
                enabled: false
        routerSpec:
          serviceType: NodePort
          nodePort: 30095
          # Chart default (initialDelaySeconds 5 + periodSeconds 5 *
          # failureThreshold 3 = ~20s total) is far stingier than the
          # model server's own startupProbe (failureThreshold 60, ~10+
          # min) — too tight here in practice: the router got SIGKILLed
          # (exit 137) by Kubernetes for "failed startup probe" over and
          # over despite its own logs showing a normal, successful
          # startup each time. Match the model server's order of
          # magnitude instead.
          startupProbe:
            failureThreshold: 60
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
