apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ykantoni/verda-k8s-apps.git
    targetRevision: HEAD
    path: search-agent
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: search-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
